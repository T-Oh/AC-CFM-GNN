name: AC-CFM-GNN
channels:
  - pyg
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  - numpy<2
  - scipy
  - pandas
  - matplotlib
  - scikit-learn
  - h5py
  - numexpr>=2.8.4     # updated to avoid Pandas warning

  # PyTorch / PyG (CPU only)
  - pytorch=*=cpu*     
  - pyg
  - torchmetrics

  # Utilities
  - json5
  - networkx
  - pickleshare
  - pip

  # Pip-only packages
  - pip:
      - bayesian-optimization==1.4.3  # needs to be <= v.1.4.3 because of ray conflicts
      - "ray[tune]"
      - seaborn
      - torcheval
