name: AC-CFM-GNN3
channels:
  - pyg
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # Core numerical stack (ALL from conda)
  - numpy<2
  - scipy
  - pandas
  - matplotlib
  - scikit-learn
  - h5py
  - numexpr>=2.8.4     # updated to avoid Pandas warning

  # PyTorch / PyG (CPU only)
  - pytorch=*=cpu*     # on Windows, remove '=*=cpu*'
  - pyg
  - torchmetrics

  # Utilities
  - json5
  - networkx
  - pickleshare
  - pip

  # Pip-only packages (no numeric core!)
  - pip:
      - bayesian-optimization==1.4.3
      - "ray[tune]"
      - seaborn
      - torcheval
